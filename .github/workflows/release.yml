# Tag-driven release: push v<version> (matching AssemblyVersion in
# SeclavePlugin/Properties/AssemblyInfo.cs) and the .plgx is built, then
# checksummed and attached, with the Linux udev script, to a DRAFT GitHub
# release for the owner to review and publish. workflow_dispatch runs the
# build without a release, whatever ref it runs on. The tests are run before
# tagging, outside GitHub.
#
# No secrets are used anywhere, and nothing is signed: integrity comes from
# SHA256SUMS.txt, authenticity from the artifact attestation below. Every
# action is pinned to a commit, refreshed by hand before a release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs get a read-only token unless they ask for more
permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  version-check:
    # A tag must name exactly what the tree says it contains.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Tag matches AssemblyVersion
        # A -rc.N / -beta suffix on the tag is ignored: rc tags rehearse the
        # release of the version they point at.
        run: |
          app=$(sed -n 's/^\[assembly: AssemblyVersion("\([0-9]*\.[0-9]*\.[0-9]*\)\..*/\1/p' SeclavePlugin/Properties/AssemblyInfo.cs)
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
          echo "tag=$tag app=$app"
          [ "$tag" = "$app" ]

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install KeePass
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q keepass2 xvfb
      - name: Package the .plgx
        run: xvfb-run -a ./create_plgx.sh
      - name: Add the Linux udev script
        run: cp linux/install-udev-rule.sh output/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: |
            output/SeclavePlugin.plgx
            output/install-udev-rule.sh
          if-no-files-found: error

  release:
    # Only a tag push releases; a manual run on a tag does not
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version-check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # attestation
      attestations: write
    steps:
      - name: Refuse to change a published release
        # Uploading to an existing release replaces its files; only a draft
        # may be replaced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "existing release for $GITHUB_REF_NAME: draft=$state"
          [ "$state" != "false" ]
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body: |
            Draft - not public until reviewed and published by the owner.
            Verify the download against SHA256SUMS.txt, or with:
            gh attestation verify SeclavePlugin.plgx --owner seclave
            gh attestation verify install-udev-rule.sh --owner seclave
